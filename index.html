            { id: 36, store: "🔫 Call of Duty Mobile", category: "GAMING", desc: "Prey & Predator Crate x3", url: "#", img: "", code: "DCEPZBZKFD", isGame: true },
            { id: 37, store: "🛡️ RAID: Shadow Legends", category: "GAMING", desc: "Free Energy & Silver", url: "#", img: "", code: "RAIDTOGETHER", isGame: true },
            { id: 38, store: "🧱 Roblox", category: "GAMING", desc: "Nguyen Boi Bundle", url: "#", img: "", code: "FREENGNBOI", isGame: true }
        ];

        function App() {
            const [ledger, setLedger] = useState(INITIAL_LEDGER);
            const [showModal, setShowModal] = useState(false);
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [searchResult, setSearchResult] = useState(null);
            const [activeFilter, setActiveFilter] = useState("ALL");

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                
                if (document.activeElement instanceof HTMLElement) {
                    document.activeElement.blur();
                }

                setAiState("searching");
                setShowModal(true);

                try {
                    // Forces the 6 second neon spinner animation to play
                    await new Promise(resolve => setTimeout(resolve, 6000));

                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: searchInput, code: "TEST-CODE" })
                    });

                    const data = await response.json();
                    const fullText = data.response || "No data received.";
                    
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const extractedUrls = fullText.match(urlRegex);
                    const linkUrl = extractedUrls ? extractedUrls[0] : null;
                    const cleanDesc = linkUrl ? fullText.replace(linkUrl, '').trim() : fullText;
                    
                    setSearchResult({ 
                        game: searchInput.toUpperCase(), 
                        codes: [{ code: "VERIFIED", desc: cleanDesc, link: linkUrl }] 
                    });
                } catch (error) {
                    setSearchResult({ 
                        game: "CONNECTION ERROR", 
                        codes: [{ code: "ERROR", desc: "Cannot reach backend: " + error.message, link: null }] 
                    });
                }
                
                setAiState("result");
            };

            const closeModal = () => {
                setSearchResult(null);
                setShowModal(false);
                setAiState("idle");
            };

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC") {
                    navigator.clipboard.writeText(codeText);
                    alert(`Copied to clipboard: ${codeText}`);
                }
            };

            const displayedLedger = activeFilter === "ALL" 
                ? ledger 
                : ledger.filter(item => item.category === activeFilter);

            return (
                <>
                    {showModal && (
                        <div className="modal-overlay">
                            <div className="modal-box glass-card neon-border">
                                {aiState === "searching" && (
                                    <div className="fade-in">
                                        <img src="logo.png" className="promo-pro-spinning-logo" alt="Scanning..." />
                                        
                                        <h2 style={{color:'#ffffff', margin: '0 0 10px 0', textAlign: 'center', letterSpacing: '2px', textShadow: '0 0 10px rgba(255,255,255,0.5)'}}>AI ENGINE ACTIVE</h2>
                                        <div className="ai-processing">SCANNING WEB DATABASES...</div>
                                        <div className="ai-terminal-log">
                                            [||||||||||||||||||||] 100%<br/>
                                            BYPASSING ENCRYPTION...<br/>
                                            EXTRACTING SECURE NODES...
                                        </div>
                                    </div>
                                )}
                                {aiState === "result" && searchResult && (
                                    <div className="modal-scroll-area fade-in">
                                        <h2 style={{color:'#ffffff', marginBottom: '20px', textAlign: 'center', borderBottom: '1px solid rgba(57, 255, 20, 0.3)', paddingBottom: '15px', textShadow: '0 0 10px rgba(255,255,255,0.5)'}}>{searchResult.game}</h2>
                                        {searchResult.codes.map((c, index) => (
                                            <div key={index} className="code-card">
                                                <div className="ai-result-desc">{c.desc}</div>
                                                <div className="ai-result-code">NODE: {c.code}</div>
                                                {c.link ? (
                                                    <a href={c.link} target="_blank" rel="noopener noreferrer" className="premium-claim-btn">
                                                        CLICK TO CLAIM DEAL
                                                    </a>
                                                ) : (
                                                    <button className="copy-btn" onClick={(e) => copyCode(e, c.code)} style={{marginTop: '15px'}}>COPY CODE</button>
                                                )}
                                            </div>
                                        ))}
                                        <button className="submit-action-btn" onClick={closeModal}>CLOSE TERMINAL</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="rt-top-nav-wrapper">
                        <div className="rt-top-nav">
                            <div className="rt-logo-container">
                                <div className="rt-logo">Promo<span>Pro</span></div>
                                <div className="ai-badge">AI-POWERED</div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="pill-container">
                        {["ALL", "EXCLUSIVES", "TRAVEL", "GAMING", "BEAUTY"].map(cat => (
                            <div 
                                key={cat} 
                                className={`pill ${activeFilter === cat ? 'active' : ''}`}
                                onClick={() => setActiveFilter(cat)}
                            >
                                {cat}
                            </div>
                        ))}
                    </div>
                    
                    <div className="verify-bar-wrapper">
                        <div className="verify-bar-container">
                            <div className="verify-bar glass-card neon-border">
                                <input 
                                    className="verify-input" 
                                    placeholder=">_ ENTER GAME NAME..." 
                                    value={searchInput}
                                    onChange={(e) => setSearchInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                />
                                <button className="verify-btn" onClick={handleVerify}>VERIFY</button>
                            </div>
                            <div className="verify-status">
                                <div className="status-dot"></div>
                                AI VERIFICATION ENGINE STANDBY...
                            </div>
                        </div>
                    </div>

                    <div className="media-grid">
                        {displayedLedger.map(p => (
                            <a className="poster-card glass-card neon-border" key={p.id} href={p.url}>
                                <div className="poster-img-box">
                                    <CardMedia src={p.img} label={p.store} isGame={p.isGame} />
                                </div>
                                <h3 className="poster-title">{p.store}</h3>
                                <p className="poster-desc">{p.desc}</p>
                                
                                <div style={{ marginTop: 'auto' }}>
                                    {p.code ? (
                                        p.code === "AUTO-ROUTED" ? (
                                            <div className="auto-routed-badge">AUTO-ROUTED LINK</div>
                                        ) : (
                                            <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>
                                                COPY: {p.code}
                                            </button>
                                        )
                                    ) : null}
                                </div>
                            </a>
                        ))}
                    </div>
                    <div className="spacer"></div>
                    
                    <div className="footer-area">
                        <p style={{ maxWidth: '800px', margin: '0 auto 15px auto', fontStyle: 'italic', lineHeight: '1.8' }}>
                            <strong>FTC Affiliate Disclosure:</strong> PromoPro is an independent verification engine and affiliate publisher. We may earn a commission from qualifying purchases or bookings made through the links on this page at no additional cost to you.
                        </p>
                        <div style={{ marginBottom: '10px', letterSpacing: '1px' }}>&copy; 2026 PromoPro AI Engine. All Rights Reserved.</div>
                        <div style={{ margin: '15px 0' }}>
                            <a href="terms.html">Terms of Service</a> &nbsp;|&nbsp; <a href="privacy.html">Privacy Policy</a>
                        </div>
                        <div style={{ marginTop: '15px', textTransform: 'uppercase', letterSpacing: '1px' }}>
                            Secure Support Channel: <a href="mailto:spjrsam82@gmail.com">spjrsam82@gmail.com</a>
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
