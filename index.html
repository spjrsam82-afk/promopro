<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PromoPro Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            /* High-res blurred desk background matching your mockup */
            background: url('https://images.unsplash.com/photo-1542831371229-5be10f0c0b11?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* THE FLOATING APP WINDOW (1:1 with mockup) */
        #root { 
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            min-height: 600px;
            background: rgba(15, 23, 42, 0.85); /* Dark slate glass */
            backdrop-filter: blur(20px);
            border: 2px solid #4ade80; /* The exact mint/neon green */
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(74, 222, 128, 0.1);
            display: flex; 
            flex-direction: row; 
            overflow: hidden;
            margin: 20px;
        }

        /* --- MOBILE RESPONSIVENESS (For your Samsung A16) --- */
        @media (max-width: 768px) {
            body { align-items: flex-start; }
            #root { flex-direction: column; height: auto; margin: 0; border-radius: 0; border: none; border-top: 2px solid #4ade80; }
            .sidebar { width: 100% !important; height: auto !important; flex-direction: row !important; flex-wrap: wrap; justify-content: center; border-right: none !important; border-bottom: 1px solid rgba(74, 222, 128, 0.3) !important; padding: 15px !important; }
            .sidebar-logo { width: 100%; justify-content: center; margin-bottom: 15px !important; }
            .nav-item { padding: 8px 12px !important; margin-bottom: 5px !important; font-size: 13px !important; }
            .main-content { padding: 15px !important; }
            .search-box { width: 100% !important; }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(74, 222, 128, 0.2);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        .sidebar-logo span { color: #4ade80; font-size: 24px; margin-right: 10px; }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        /* Active state matching the dark green filled pill from mockup */
        .nav-item:hover, .nav-item.active {
            background: rgba(22, 101, 52, 0.8);
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(74, 222, 128, 0.2);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* HEADER / SEARCH AREA */
        .window-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        .window-title { font-size: 24px; font-weight: bold; color: #ffffff; margin: 0; }

        .search-box {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(74, 222, 128, 0.5);
            border-radius: 8px;
            overflow: hidden;
            width: 350px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; color: #4ade80; padding: 10px 15px; font-family: monospace; font-size: 14px; outline: none;
        }
        .search-input::placeholder { color: rgba(74, 222, 128, 0.4); }
        .search-btn {
            background: rgba(74, 222, 128, 0.2); color: #4ade80; border: none; border-left: 1px solid rgba(74, 222, 128, 0.5); padding: 0 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .search-btn:hover { background: #4ade80; color: #022c22; }

        /* --- CARDS (1:1 with mockup) --- */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
        }

        .mockup-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: 0.3s;
        }
        .mockup-card:hover {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        .card-top-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Unbreakable Clearbit Logos */
        .card-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: contain;
            background: #ffffff;
            padding: 5px;
        }

        .card-details { flex: 1; }
        
        /* Matches the small orange text, large white text, small green subtext */
        .mockup-orange-title { color: #f97316; font-size: 14px; font-weight: bold; margin: 0 0 2px 0; display: flex; align-items: center; gap: 8px; }
        .mockup-orange-title span { background: #f97316; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        
        .mockup-main-title { font-size: 22px; font-weight: bold; color: #ffffff; margin: 0 0 4px 0; }
        .mockup-subtext { font-size: 12px; color: #a1a1aa; margin: 0; }

        .card-icons {
            font-size: 20px;
            display: flex;
            gap: 10px;
            color: #fbbf24;
        }

        /* THE MASSIVE GREEN BUTTON */
        .claim-btn {
            width: 100%;
            background: #4ade80;
            color: #022c22; /* Dark green/black text */
            border: none;
            padding: 14px;
            font-weight: 900;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .claim-btn:hover { background: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); }

        .copy-btn {
            width: 100%; background: transparent; color: #4ade80; border: 1px solid #4ade80; padding: 14px; font-weight: 900; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center;
        }
        .copy-btn:hover { background: #4ade80; color: #022c22; }

        /* --- THE ANIMATION OVERLAY --- */
        .searching-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        
        @keyframes customSpin { 100% { transform: rotate(360deg); } }
        .spinning-logo { 
            width: 120px; 
            height: 120px; 
            animation: customSpin 4s linear infinite; 
            filter: drop-shadow(0 0 20px #4ade80); 
            margin-bottom: 25px; 
            object-fit: contain;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Rock-Solid Logos using Clearbit API (These won't break)
        const INITIAL_LEDGER = [
            { id: 101, store: "GAMIVO", category: "GAMING", label: "Anal Pro", desc: "Show • Creal • 338%", url: "YOUR_GAMIVO_AFFILIATE_LINK", img: "https://logo.clearbit.com/gamivo.com", isGame: false },
            { id: 102, store: "GearUP", category: "GAMING", label: "AI Node", desc: "State • Cred • 390%", url: "YOUR_GEARUP_LINK", img: "https://logo.clearbit.com/gearupbooster.com", isGame: false },
            { id: 103, store: "Expedia", category: "TRAVEL", label: "Travel Pro", desc: "Global Flights & Hotels", url: "http://www.anrdoezrs.net/click-101761790-10604120", img: "https://logo.clearbit.com/expedia.com", isGame: false },
            { id: 104, store: "GameFly", category: "GAMING", label: "Rental Node", desc: "Console Game Rentals", url: "YOUR_GAMEFLY_LINK", img: "https://logo.clearbit.com/gamefly.com", isGame: false },
            { id: 105, store: "Whiteout Survival", category: "GAMING", label: "Mobile Node", desc: "100 Gems & Resources", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/08/94/39/0894396b-5c8e-5992-0b89-a29d6c1df779/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "wm6xPkX4w", isGame: true },
            { id: 106, store: "Merge Dragons!", category: "GAMING", label: "Mobile Node", desc: "New Player Bonus", url: "YOUR_IMPACT_LINK", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/7e/6d/2c/7e6d2c14-5d51-6c58-8b9a-4f51e04cf5e2/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "AUTO-ROUTED", isGame: true },
            { id: 107, store: "Hotels.com", category: "TRAVEL", label: "Travel Node", desc: "Global Lodging", url: "https://www.dpbolvw.net/click-101761790-13828058", img: "https://logo.clearbit.com/hotels.com", isGame: false }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [activeFilter, setActiveFilter] = useState("ALL");
            const [dynamicResult, setDynamicResult] = useState(null);

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                await new Promise(resolve => setTimeout(resolve, 6000));

                const searchLower = searchInput.toLowerCase();
                const matchedAffiliate = INITIAL_LEDGER.find(item => item.store.toLowerCase().includes(searchLower) || item.desc.toLowerCase().includes(searchLower));

                if (matchedAffiliate) {
                    setDynamicResult(matchedAffiliate);
                    setAiState("idle");
                    return;
                }

                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: searchInput, code: "TEST-CODE" })
                    });
                    const data = await response.json();
                    const fullText = data.response || "No data received.";
                    
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const extractedUrls = fullText.match(urlRegex);
                    const linkUrl = extractedUrls ? extractedUrls[0] : null;
                    const cleanDesc = linkUrl ? fullText.replace(linkUrl, '').trim() : fullText;
                    
                    setDynamicResult({ store: searchInput.toUpperCase(), category: "AI SEARCH", label: "Extracted", desc: cleanDesc, url: linkUrl, img: "https://logo.clearbit.com/cloud.google.com", code: "VERIFIED" });
                } catch (error) {
                    setDynamicResult({ store: "SYSTEM ERROR", category: "ERROR", label: "Failed", desc: "Backend not reached. Please check server.", url: null, img: "https://logo.clearbit.com/cloudflare.com", code: "ERROR" });
                }
                setAiState("idle");
            };

            const displayedLedger = dynamicResult ? [dynamicResult] : (activeFilter === "ALL" ? INITIAL_LEDGER : INITIAL_LEDGER.filter(item => item.category === activeFilter));

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC" && codeText !== "VERIFIED") {
                    navigator.clipboard.writeText(codeText);
                    alert(`Copied to clipboard: ${codeText}`);
                }
            };

            return (
                <>
                    <div className="sidebar">
                        <div className="sidebar-logo"><span>P</span>PromoPro</div>
                        <div className={`nav-item ${activeFilter === "ALL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("ALL"); setDynamicResult(null);}}>🏠 Home</div>
                        <div className={`nav-item ${activeFilter === "GAMING" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("GAMING"); setDynamicResult(null);}}>🎮 Gaming</div>
                        <div className={`nav-item ${activeFilter === "EXCLUSIVES" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("EXCLUSIVES"); setDynamicResult(null);}}>🔒 Exclusives</div>
                        <div className={`nav-item ${activeFilter === "TRAVEL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("TRAVEL"); setDynamicResult(null);}}>✈️ Travel</div>
                    </div>

                    <div className="main-content">
                        
                        {/* THIS TAG REQUIRES image_735d5d.png TO BE IN GITHUB */}
                        {aiState === "searching" && (
                            <div className="searching-overlay">
                                <img src="image_735d5d.png" className="spinning-logo" alt="If you see this text, upload image_735d5d.png to GitHub!" />
                                <h2 style={{color: '#4ade80', letterSpacing: '2px'}}>AI ENGINE ACTIVE</h2>
                                <p style={{fontFamily: 'monospace', color: '#94a3b8'}}>SCANNING DATABASES...</p>
                            </div>
                        )}

                        <div className="window-header">
                            <h1 className="window-title">Results</h1>
                            <div className="search-box">
                                <input 
                                    className="search-input" 
                                    placeholder="Verify Game or Store..." 
                                    value={searchInput}
                                    onChange={(e) => setSearchInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                />
                                <button className="search-btn" onClick={handleVerify}>SCAN</button>
                            </div>
                        </div>

                        <div className="results-list">
                            {displayedLedger.map((p, index) => (
                                <div className="mockup-card" key={p.id || index}>
                                    <div className="card-top-row">
                                        <img src={p.img} alt={p.store} className="card-image" />
                                        <div className="card-details">
                                            <div className="mockup-orange-title">
                                                {p.store} <span>{p.label}</span>
                                            </div>
                                            <h3 className="mockup-main-title">{p.store}</h3>
                                            <p className="mockup-subtext">{p.desc}</p>
                                        </div>
                                        <div className="card-icons">
                                            🪙 🛒 ✎
                                        </div>
                                    </div>
                                    
                                    {p.url && p.url !== "#" ? (
                                        <a href={p.url} target="_blank" rel="noopener noreferrer" className="claim-btn">Claim Deal</a>
                                    ) : p.code ? (
                                        <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>COPY CODE: {p.code}</button>
                                    ) : (
                                        <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed', color: '#94a3b8', borderColor: '#94a3b8'}}>NO CODES</button>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
