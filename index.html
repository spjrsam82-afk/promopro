<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Promo Pro Matrix</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            /* High-res Global Network background */
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .overlay-tint {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 9, 24, 0.75);
            z-index: -1;
        }

        /* --- TOP NAVIGATION BAR --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            z-index: 10;
            position: sticky;
            top: 0;
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            text-transform: uppercase;
        }
        .nav-logo span { color: #00f0ff; margin-right: 10px; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        
        .search-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            outline: none;
            width: 300px;
            transition: 0.3s;
        }
        .search-input:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .search-input::placeholder { color: rgba(0, 240, 255, 0.5); }
        
        .execute-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #00f0ff;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .execute-btn:hover { background: #00f0ff; color: #020617; box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }

        /* --- MOBILE RESPONSIVENESS FOR GALAXY A16 --- */
        @media (max-width: 768px) {
            .top-nav { flex-direction: column; gap: 15px; padding: 20px; }
            .nav-actions { width: 100%; flex-direction: column; }
            .search-input { width: 100%; }
            .execute-btn { width: 100%; }
            .dashboard-grid { grid-template-columns: 1fr !important; padding: 20px !important; }
        }

        /* --- THE PROMO PRO GRID --- */
        .dashboard-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            z-index: 10;
        }

        /* --- THE ROUNDED GLASS CARDS --- */
        .glass-card {
            background: rgba(13, 20, 35, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 240, 255, 0.05);
            transition: 0.3s;
        }
        .glass-card:hover {
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 25px rgba(0, 240, 255, 0.15);
            transform: translateY(-5px);
        }

        /* Card Internals */
        .card-header-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        
        .card-logo-wrapper {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card-logo { width: 100%; height: 100%; object-fit: contain; }

        .card-title-box { flex: 1; }
        .card-store-name { font-size: 20px; font-weight: 900; color: #ffffff; margin: 0; letter-spacing: 0.5px; }
        .card-node-type { font-size: 12px; color: #00f0ff; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }

        .card-desc { font-size: 14px; color: #a1a1aa; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }

        /* THE MASSIVE GREEN CLAIM BUTTON */
        .claim-btn {
            width: 100%;
            background: #4ade80; /* Neon Green */
            color: #022c22;
            border: none;
            padding: 16px;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: auto;
        }
        .claim-btn:hover { background: #ffffff; box-shadow: 0 0 20px rgba(74, 222, 128, 0.6); transform: scale(1.02); }

        .copy-btn {
            width: 100%; background: transparent; color: #4ade80; border: 2px solid #4ade80; padding: 14px; font-weight: 900; font-size: 15px; text-transform: uppercase; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; margin-top: auto; letter-spacing: 1px;
        }
        .copy-btn:hover { background: #4ade80; color: #022c22; }

        /* --- THE ANIMATION & RESULT OVERLAY --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 9, 24, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        
        @keyframes customSpin { 100% { transform: rotate(360deg); } }
        .spinning-logo { 
            width: 140px; 
            height: 140px; 
            animation: customSpin 4s linear infinite; 
            filter: drop-shadow(0 0 30px #00f0ff); 
            margin-bottom: 30px; 
            object-fit: contain;
        }

        .ai-text { color: #00f0ff; font-weight: 900; letter-spacing: 3px; font-size: 24px; margin-bottom: 12px; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }
        .ai-subtext { font-family: monospace; color: #94a3b8; font-size: 14px; letter-spacing: 1px; }

        .close-btn { position: absolute; top: 30px; right: 40px; background: transparent; color: #fff; border: 1px solid #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .close-btn:hover { background: #fff; color: #000; }

        .fallback-bg { background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #00f0ff; font-weight: bold; font-size: 10px; text-align: center; width: 100%; height: 100%; padding: 5px;}
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SafeImage = ({ src, alt, className }) => {
            const [error, setError] = useState(false);
            if (error || !src) return <div className={`fallback-bg ${className}`}>{alt}</div>;
            return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
        };

        // ACTUAL PROMO-PRO LEDGER DATA
        const INITIAL_LEDGER = [
            { id: 1, store: "GAMIVO", category: "Digital Key", desc: "Massive Discounts on Steam, Xbox & PSN Keys. Save instantly on top titles.", url: "YOUR_GAMIVO_AFFILIATE_LINK", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Gamivo_logo.png/320px-Gamivo_logo.png", isGame: false },
            { id: 2, store: "NordVPN", category: "Security", desc: "Military-grade encryption tunnel. Secure your gaming network and lower ping.", url: "YOUR_NORDVPN_LINK", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/NordVPN_logo.svg/512px-NordVPN_logo.svg.png", isGame: false },
            { id: 3, store: "Whiteout Survival", category: "Mobile Gaming", desc: "Claim 100 Free Gems & Daily Resources using the active verification node.", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/08/94/39/0894396b-5c8e-5992-0b89-a29d6c1df779/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "wm6xPkX4w", isGame: true },
            { id: 4, store: "Merge Dragons!", category: "Mobile Gaming", desc: "New Player Bonus & Camp Resources. Auto-routed via Impact partnership.", url: "YOUR_IMPACT_LINK", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/7e/6d/2c/7e6d2c14-5d51-6c58-8b9a-4f51e04cf5e2/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "AUTO-ROUTED", isGame: true },
            { id: 5, store: "JustPlay", category: "Rewards", desc: "Play Mobile Games & Earn Real Rewards. Cash out instantly.", url: "YOUR_JUSTPLAY_LINK", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f0/a6/f0/f0a6f0a4-37f2-1a74-9f20-b32de22c4f74/AppIcon-0-0-1x_U007emarketing-0-7-0-85-220.png/512x512bb.jpg", isGame: false },
            { id: 6, store: "GameFly", category: "Console", desc: "Premium Console Game Rentals. Access the newest PS5 and Xbox titles.", url: "YOUR_GAMEFLY_LINK", img: "https://upload.wikimedia.org/wikipedia/commons/e/e0/GameFly_logo.svg", isGame: false },
            { id: 7, store: "State of Survival", category: "Mobile Gaming", desc: "1000 Biocaps & Speedups. Active global code verified.", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/31/57/02/3157021b-db87-8d07-2856-78e72750e3a6/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "SOS2026", isGame: true },
            { id: 8, store: "Expedia", category: "Travel", desc: "Global Flights & Premium Hotel Reservations at a discounted affiliate rate.", url: "http://www.anrdoezrs.net/click-101761790-10604120", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Expedia_logo.svg/512px-Expedia_logo.svg.png", isGame: false }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [dynamicResult, setDynamicResult] = useState(null);

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                // Wait 6 seconds to show the animation using your exact file
                await new Promise(resolve => setTimeout(resolve, 6000));

                const searchLower = searchInput.toLowerCase();
                const matchedAffiliate = INITIAL_LEDGER.find(item => item.store.toLowerCase().includes(searchLower) || item.desc.toLowerCase().includes(searchLower));

                if (matchedAffiliate) {
                    setDynamicResult(matchedAffiliate);
                    setAiState("result");
                    return;
                }

                // Fallback for searches not in the ledger
                setDynamicResult({ store: searchInput.toUpperCase(), category: "Web Extracted", desc: "AI Engine verified custom parameters for this query.", url: "#", img: null, code: "VERIFIED" });
                setAiState("result");
            };

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC" && codeText !== "VERIFIED") {
                    navigator.clipboard.writeText(codeText);
                    alert(`System Log: Copied ${codeText} to clipboard.`);
                }
            };

            return (
                <>
                    <div className="overlay-tint"></div>

                    {/* EXACT TOP NAVIGATION FROM MOCKUP */}
                    <div className="top-nav">
                        <div className="nav-logo">
                            <span>>_</span> PROMO PRO MATRIX
                        </div>
                        <div className="nav-actions">
                            <input 
                                className="search-input" 
                                placeholder="Verify Game or Store..." 
                                value={searchInput}
                                onChange={(e) => setSearchInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                            />
                            <button className="execute-btn" onClick={handleVerify}>Execute</button>
                        </div>
                    </div>

                    {/* PROMO PRO AFFILIATE CARDS (No Personal Hubs) */}
                    {aiState === "idle" && (
                        <div className="dashboard-grid">
                            {INITIAL_LEDGER.map((p, index) => (
                                <div className="glass-card" key={p.id || index}>
                                    <div className="card-header-row">
                                        <div className="card-logo-wrapper">
                                            <SafeImage src={p.img} alt={p.store} className="card-logo" />
                                        </div>
                                        <div className="card-title-box">
                                            <h3 className="card-store-name">{p.store}</h3>
                                            <div className="card-node-type">// {p.category} NODE</div>
                                        </div>
                                    </div>
                                    
                                    <div className="card-desc">{p.desc}</div>

                                    {p.url && p.url !== "#" ? (
                                        <a href={p.url} target="_blank" rel="noopener noreferrer" className="claim-btn">
                                            Claim Deal
                                        </a>
                                    ) : p.code ? (
                                        <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>
                                            COPY CODE: {p.code}
                                        </button>
                                    ) : (
                                        <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed', color: '#94a3b8', borderColor: '#94a3b8'}}>
                                            NO CODES
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}

                    {/* --- THE ANIMATION OVERLAY --- */}
                    {aiState === "searching" && (
                        <div className="modal-overlay">
                            {/* Uses the exact file name you specified */}
                            <img src="1781102482198.png" className="spinning-logo" alt="Scanning..." />
                            <div className="ai-text">AI ENGINE ACTIVE</div>
                            <div className="ai-subtext">BYPASSING ENCRYPTION & EXTRACTING NODES...</div>
                        </div>
                    )}

                    {/* --- THE SEARCH RESULT OVERLAY --- */}
                    {aiState === "result" && dynamicResult && (
                        <div className="modal-overlay">
                            <button className="close-btn" onClick={() => setAiState("idle")}>X CLOSE</button>
                            
                            <div className="glass-card" style={{width: '90%', maxWidth: '500px'}}>
                                <div className="card-header-row">
                                    <div className="card-logo-wrapper">
                                        <SafeImage src={dynamicResult.img} alt={dynamicResult.store} className="card-logo" />
                                    </div>
                                    <div className="card-title-box">
                                        <h3 className="card-store-name">{dynamicResult.store}</h3>
                                        <div className="card-node-type">// {dynamicResult.category} NODE</div>
                                    </div>
                                </div>
                                <div className="card-desc" style={{marginBottom: '20px'}}>{dynamicResult.desc}</div>

                                {dynamicResult.url && dynamicResult.url !== "#" ? (
                                    <a href={dynamicResult.url} target="_blank" rel="noopener noreferrer" className="claim-btn">
                                        Claim Deal
                                    </a>
                                ) : dynamicResult.code ? (
                                    <button className="copy-btn" onClick={(e) => copyCode(e, dynamicResult.code)}>
                                        COPY CODE: {dynamicResult.code}
                                    </button>
                                ) : (
                                    <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed', color: '#94a3b8', borderColor: '#94a3b8'}}>
                                        NO CODES
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
