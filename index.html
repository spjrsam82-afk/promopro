                        setSearchResult({ game: matchKey.toUpperCase(), codes: AI_DATABASE[matchKey] });
                    } else {
                        setSearchResult({ game: searchInput.toUpperCase(), codes: [{ code: "NONE FOUND", desc: "No active codes verified by AI Engine at this time." }] });
                    }
                    setAiState("result");
                }, 2000);
            };

            const closeModal = () => {
                setShowModal(false);
                setAiState("idle");
                setSearchResult(null);
                setSearchInput("");
            };

            return (
                <>
                    {showModal && (
                        <div className="modal-overlay">
                            <div className="modal-box">
                                {aiState === "searching" && (
                                    <>
                                        <div className="status-dot" style={{width: '20px', height: '20px', margin: '0 auto 20px'}}></div>
                                        <h2 style={{color:'white'}}>AI ENGINE PROCESSING</h2>
                                        <div className="ai-processing">SCYTHING WEB DATABASES...</div>
                                    </>
                                )}
                                {aiState === "result" && searchResult && (
                                    <div className="modal-scroll-area">
                                        <h2 style={{color:'white', marginBottom: '15px', position: 'sticky', top: 0, background: '#0a192f', paddingBottom: '10px', zIndex: 5}}>{searchResult.game}</h2>
                                        {searchResult.codes.map((c, index) => (
                                            <div key={index} className="code-card">
                                                <div className="ai-result-desc">{c.desc}</div>
                                                <div className="ai-result-code">{c.code}</div>
                                            </div>
                                        ))}
                                        <button className="submit-action-btn" onClick={closeModal} style={{position: 'sticky', bottom: 0, zIndex: 5}}>ACKNOWLEDGE & CLOSE</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="rt-top-nav-wrapper">
                        <div className="rt-top-nav">
                            <div className="rt-logo-container">
                                <div className="rt-logo">Promo<span>Pro</span></div>
                                <div className="ai-badge">AI-POWERED</div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="pill-container">
                        {["ALL", "EXCLUSIVES", "TRAVEL", "GAMING", "BEAUTY"].map(cat => <div key={cat} className="pill">{cat}</div>)}
                    </div>
                    
                    <div className="verify-bar-wrapper">
                        <div className="verify-bar-container">
                            <div className="verify-bar">
                                <input 
                                    className="verify-input" 
                                    placeholder=">_ ENTER GAME NAME FOR AI VERIFICATION..." 
                                    value={searchInput}
                                    onChange={(e) => setSearchInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                />
                                <button className="verify-btn" onClick={handleVerify}>VERIFY</button>
                            </div>
                            <div className="verify-status">
                                <div className="status-dot"></div>
                                AI VERIFICATION ENGINE STANDBY...
                            </div>
                        </div>
                    </div>

                    <div className="media-grid">
                        {ledger.map(p => (
                            <a className="poster-card" key={p.id} href={p.url}>
                                <div className="poster-img-box">
                                    <CardMedia src={p.img} label={p.store} isGame={p.isGame} />
                                </div>
                                <h3 className="poster-title">{p.store}</h3>
                                <p style={{lineHeight: '1.4'}} className="poster-desc">{p.desc}</p>
                                <div style={{textAlign: 'center'}}><span className="poster-date">{p.code}</span></div>
                            </a>
                        ))}
                    </div>
                    <div className="spacer"></div>
                    <div className="footer-note">PRO-ENGINE // AFFILIATE TRACKING VERSION 2026.05</div>
                    
                    <div style={{ textAlign: 'center', padding: '20px 40px 40px', color: '#64748b', fontSize: '11px', borderTop: '1px solid #1e293b', background: '#0a192f' }}>
                        <p style={{ maxWidth: '800px', margin: '0 auto 15px auto', fontStyle: 'italic', lineHeight: '1.5' }}>
                            <strong>FTC Affiliate Disclosure:</strong> PromoPro is an independent verification engine and affiliate publisher. We may earn a commission from qualifying purchases or bookings made through the links on this page at no additional cost to you.
                        </p>
                        <div style={{ marginBottom: '10px' }}>&copy; 2026 PromoPro AI Engine. All Rights Reserved.</div>
                        <div>
                            <a href="terms.html" style={{ color: '#f97316', textDecoration: 'none', margin: '0 10px', fontWeight: 'bold' }}>Terms of Service</a> | 
                            <a href="privacy.html" style={{ color: '#f97316', textDecoration: 'none', margin: '0 10px', fontWeight: 'bold' }}>Privacy Policy</a>
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
