<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PromoPro Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        #root { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: row; 
            background: rgba(2, 6, 23, 0.7); 
        }

        @media (max-width: 768px) {
            #root { flex-direction: column; height: auto; }
            .sidebar { width: 100% !important; height: auto !important; flex-direction: row !important; flex-wrap: wrap; justify-content: center; border-right: none !important; border-bottom: 1px solid rgba(64, 224, 208, 0.3) !important; padding: 15px !important; }
            .sidebar-logo { margin-bottom: 10px !important; width: 100%; justify-content: center; }
            .nav-item { padding: 8px 15px !important; margin-bottom: 5px !important; font-size: 13px; }
            .main-content { padding: 15px !important; }
            .dashboard-window { padding: 20px !important; }
            .search-box { flex-direction: column; width: 100% !important; }
            .search-btn { padding: 15px !important; width: 100%; }
        }

        .sidebar {
            width: 260px;
            background: rgba(10, 25, 47, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(64, 224, 208, 0.3);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #40e0d0; 
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(64, 224, 208, 0.5);
        }
        .sidebar-logo span { color: #f97316; margin-right: 5px; text-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #a1a1aa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(64, 224, 208, 0.1);
            color: #40e0d0;
            border-left: 4px solid #f97316; 
        }

        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard-window {
            width: 100%;
            max-width: 1200px;
            background: rgba(6, 15, 28, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(64, 224, 208, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(64, 224, 208, 0.15);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
        }

        .window-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(64, 224, 208, 0.2);
            padding-bottom: 20px;
            gap: 15px;
        }
        .window-title { font-size: 22px; font-weight: 900; color: #ffffff; margin: 0; }

        .search-box {
            display: flex;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #40e0d0;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; color: #40e0d0; padding: 12px 20px; font-family: monospace; font-size: 16px; outline: none;
        }
        .search-input::placeholder { color: rgba(64, 224, 208, 0.5); }
        .search-btn {
            background: #f97316; color: #ffffff; border: none; padding: 0 25px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .search-btn:hover { background: #40e0d0; color: #020617; }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .compact-card {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(64, 224, 208, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .compact-card:hover {
            box-shadow: 0 0 20px rgba(64, 224, 208, 0.3);
            border-color: #40e0d0;
            transform: translateY(-5px);
        }

        /* Image styling adjusted to fit real game icons perfectly */
        .card-image {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            object-fit: contain; /* Keeps entire logos visible */
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            padding: 10px;
        }

        .card-title { font-size: 18px; font-weight: 900; color: #ffffff; margin: 0 0 8px 0; text-align: center;}
        .card-desc { font-size: 13px; color: #a1a1aa; margin: 0 0 15px 0; text-align: center; flex-grow: 1; line-height: 1.4; }

        .claim-btn {
            width: 100%;
            background: linear-gradient(90deg, #40e0d0, #00b3cc);
            color: #020617;
            border: none;
            padding: 12px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: auto;
        }
        .claim-btn:hover { background: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.6); color: #ffffff; }

        .copy-btn {
            width: 100%; background: rgba(249, 115, 22, 0.1); color: #f97316; border: 1px solid #f97316; padding: 12px; font-weight: 900; font-size: 14px; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: auto;
        }
        .copy-btn:hover { background: #f97316; color: #020617; }

        /* --- YOUR CUSTOM IMAGE SPINNER IS BACK --- */
        .searching-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 6, 23, 0.95);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        
        @keyframes customSpin { 100% { transform: rotate(360deg); } }
        .spinning-logo { 
            width: 140px; 
            height: 140px; 
            animation: customSpin 4s linear infinite; 
            filter: drop-shadow(0 0 20px #40e0d0); 
            margin-bottom: 25px; 
            object-fit: contain;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // REAL OFFICIAL LOGOS AND APP STORE IMAGES LOADED
        const INITIAL_LEDGER = [
            { id: 101, store: "GAMIVO", category: "GAMING", desc: "Massive Discounts on Steam, Xbox & PSN Keys!", url: "YOUR_GAMIVO_AFFILIATE_LINK_HERE", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Gamivo_logo.png/320px-Gamivo_logo.png", isGame: false },
            { id: 102, store: "GameFly", category: "GAMING", desc: "Rent & Buy Top Console Games.", url: "YOUR_GAMEFLY_LINK", img: "https://upload.wikimedia.org/wikipedia/commons/e/e0/GameFly_logo.svg", isGame: false },
            { id: 103, store: "Whiteout Survival", category: "GAMING", desc: "Claim 100 Gems & Daily Resources", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/08/94/39/0894396b-5c8e-5992-0b89-a29d6c1df779/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "wm6xPkX4w", isGame: true },
            { id: 104, store: "Merge Dragons!", category: "GAMING", desc: "New Player Bonus & Camp Resources", url: "YOUR_IMPACT_LINK", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/7e/6d/2c/7e6d2c14-5d51-6c58-8b9a-4f51e04cf5e2/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "AUTO-ROUTED", isGame: true },
            { id: 105, store: "State of Survival", category: "GAMING", desc: "1000 Biocaps & Speedups", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/31/57/02/3157021b-db87-8d07-2856-78e72750e3a6/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "SOS2026", isGame: true },
            { id: 106, store: "Golf Rival", category: "GAMING", desc: "Free Gems & Legendary Club Chest", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a4/09/b8/a409b85c-6b3a-5f34-318e-4f058e5a7b8e/AppIcon-0-0-1x_U007emarketing-0-0-0-5-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", isGame: true },
            { id: 107, store: "Idle Outpost", category: "GAMING", desc: "Scavenger Boosts & Caps", url: "#", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/21/53/43/21534351-876a-542e-18e3-05c2a121e7d2/AppIcon-1x_U007emarketing-0-7-0-85-220.png/512x512bb.jpg", isGame: true },
            { id: 108, store: "JustPlay", category: "EXCLUSIVES", desc: "Play Games & Earn Real Rewards", url: "YOUR_JUSTPLAY_LINK", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f0/a6/f0/f0a6f0a4-37f2-1a74-9f20-b32de22c4f74/AppIcon-0-0-1x_U007emarketing-0-7-0-85-220.png/512x512bb.jpg", isGame: false }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [activeFilter, setActiveFilter] = useState("ALL");
            const [dynamicResult, setDynamicResult] = useState(null);

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                // Forces 6 second animation of your custom logo
                await new Promise(resolve => setTimeout(resolve, 6000));

                const searchLower = searchInput.toLowerCase();
                const matchedAffiliate = INITIAL_LEDGER.find(item => item.store.toLowerCase().includes(searchLower) || item.desc.toLowerCase().includes(searchLower));

                if (matchedAffiliate) {
                    setDynamicResult(matchedAffiliate);
                    setAiState("idle");
                    return;
                }

                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: searchInput, code: "TEST-CODE" })
                    });
                    const data = await response.json();
                    const fullText = data.response || "No data received.";
                    
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const extractedUrls = fullText.match(urlRegex);
                    const linkUrl = extractedUrls ? extractedUrls[0] : null;
                    const cleanDesc = linkUrl ? fullText.replace(linkUrl, '').trim() : fullText;
                    
                    setDynamicResult({ store: searchInput.toUpperCase(), desc: cleanDesc, url: linkUrl, img: "logo.png", code: "VERIFIED" });
                } catch (error) {
                    setDynamicResult({ store: "SYSTEM ERROR", desc: "Backend not reached. Please check server.", url: null, img: "logo.png", code: "ERROR" });
                }
                setAiState("idle");
            };

            const displayedLedger = dynamicResult ? [dynamicResult] : (activeFilter === "ALL" ? INITIAL_LEDGER : INITIAL_LEDGER.filter(item => item.category === activeFilter));

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC" && codeText !== "VERIFIED") {
                    navigator.clipboard.writeText(codeText);
                    alert(`Copied to clipboard: ${codeText}`);
                }
            };

            return (
                <>
                    <div className="sidebar">
                        <div className="sidebar-logo"><span>>_</span>PromoPro</div>
                        <div className={`nav-item ${activeFilter === "ALL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("ALL"); setDynamicResult(null);}}>🏠 Dashboard</div>
                        <div className={`nav-item ${activeFilter === "GAMING" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("GAMING"); setDynamicResult(null);}}>🎮 Gaming</div>
                        <div className={`nav-item ${activeFilter === "EXCLUSIVES" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("EXCLUSIVES"); setDynamicResult(null);}}>🔒 Exclusives</div>
                        <div className={`nav-item ${activeFilter === "TRAVEL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("TRAVEL"); setDynamicResult(null);}}>✈️ Travel</div>
                    </div>

                    <div className="main-content">
                        <div className="dashboard-window">
                            
                            {/* YOUR CUSTOM UPLOADED LOGO IS BACK HERE */}
                            {aiState === "searching" && (
                                <div className="searching-overlay">
                                    <img src="logo.png" className="spinning-logo" alt="Scanning..." />
                                    <h2 style={{color: '#40e0d0', letterSpacing: '2px', textShadow: '0 0 10px rgba(64, 224, 208, 0.5)'}}>AI SCAN IN PROGRESS</h2>
                                    <p style={{fontFamily: 'monospace', color: '#f97316'}}>BYPASSING ENCRYPTION & EXTRACTING NODES...</p>
                                </div>
                            )}

                            <div className="window-header">
                                <h1 className="window-title">System Database</h1>
                                <div className="search-box">
                                    <input 
                                        className="search-input" 
                                        placeholder="Verify Game or Store..." 
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                    />
                                    <button className="search-btn" onClick={handleVerify}>SCAN</button>
                                </div>
                            </div>

                            <div className="results-grid">
                                {displayedLedger.map((p, index) => (
                                    <div className="compact-card" key={p.id || index}>
                                        <img src={p.img} alt={p.store} className="card-image" />
                                        <h3 className="card-title">{p.store}</h3>
                                        <p className="card-desc">{p.desc}</p>
                                        
                                        {p.url && p.url !== "#" ? (
                                            <a href={p.url} target="_blank" rel="noopener noreferrer" className="claim-btn">Claim Deal</a>
                                        ) : p.code ? (
                                            <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>COPY: {p.code}</button>
                                        ) : (
                                            <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed', color: '#a1a1aa', borderColor: '#a1a1aa'}}>NO CODES</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
