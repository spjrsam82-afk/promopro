<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PromoPro Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        #root { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: row; /* Desktop default */
            background: rgba(2, 6, 23, 0.7); /* Darkens the space background */
        }

        /* --- RESPONSIVE LAYOUT FOR MOBILE --- */
        @media (max-width: 768px) {
            #root { flex-direction: column; height: auto; }
            .sidebar { width: 100% !important; height: auto !important; flex-direction: row !important; flex-wrap: wrap; justify-content: center; border-right: none !important; border-bottom: 1px solid rgba(64, 224, 208, 0.3) !important; padding: 15px !important; }
            .sidebar-logo { margin-bottom: 10px !important; width: 100%; justify-content: center; }
            .nav-item { padding: 8px 15px !important; margin-bottom: 5px !important; font-size: 13px; }
            .main-content { padding: 15px !important; }
            .dashboard-window { padding: 20px !important; }
            .search-box { flex-direction: column; width: 100% !important; }
            .search-btn { padding: 15px !important; width: 100%; }
        }

        /* --- SIDEBAR LAYOUT --- */
        .sidebar {
            width: 260px;
            background: rgba(10, 25, 47, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(64, 224, 208, 0.3);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #40e0d0; /* Turquoise */
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(64, 224, 208, 0.5);
        }
        .sidebar-logo span { color: #f97316; margin-right: 5px; text-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #a1a1aa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(64, 224, 208, 0.1);
            color: #40e0d0;
            border-left: 4px solid #f97316; /* Orange accent */
        }

        /* --- MAIN DASHBOARD AREA --- */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* THE MASSIVE GLASS WINDOW */
        .dashboard-window {
            width: 100%;
            max-width: 1200px;
            background: rgba(6, 15, 28, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(64, 224, 208, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(64, 224, 208, 0.15);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
        }

        /* HEADER / SEARCH AREA */
        .window-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(64, 224, 208, 0.2);
            padding-bottom: 20px;
            gap: 15px;
        }
        .window-title { font-size: 22px; font-weight: 900; color: #ffffff; margin: 0; }

        .search-box {
            display: flex;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #40e0d0;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; color: #40e0d0; padding: 12px 20px; font-family: monospace; font-size: 16px; outline: none;
        }
        .search-input::placeholder { color: rgba(64, 224, 208, 0.5); }
        .search-btn {
            background: #f97316; color: #ffffff; border: none; padding: 0 25px; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover { background: #40e0d0; color: #020617; }

        /* --- COMPACT CARDS GRID (Replaces the wide stretched layout) --- */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .compact-card {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(64, 224, 208, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .compact-card:hover {
            box-shadow: 0 0 20px rgba(64, 224, 208, 0.3);
            border-color: #40e0d0;
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .card-title { font-size: 18px; font-weight: 900; color: #ffffff; margin: 0 0 8px 0; text-align: center;}
        .card-desc { font-size: 13px; color: #a1a1aa; margin: 0 0 15px 0; text-align: center; flex-grow: 1; line-height: 1.4; }

        /* TURQUOISE & ORANGE CLAIM BUTTONS */
        .claim-btn {
            width: 100%;
            background: linear-gradient(90deg, #40e0d0, #00b3cc);
            color: #020617;
            border: none;
            padding: 12px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: auto;
        }
        .claim-btn:hover { background: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.6); color: #ffffff; }

        .copy-btn {
            width: 100%; background: rgba(249, 115, 22, 0.1); color: #f97316; border: 1px solid #f97316; padding: 12px; font-weight: 900; font-size: 14px; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: auto;
        }
        .copy-btn:hover { background: #f97316; color: #020617; }

        /* --- PURE CSS SPINNER (No images to break!) --- */
        .searching-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 6, 23, 0.95);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        
        .pure-css-spinner {
            width: 80px; height: 80px;
            border: 6px solid rgba(64, 224, 208, 0.1);
            border-top: 6px solid #40e0d0; /* Turquoise */
            border-bottom: 6px solid #f97316; /* Orange */
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(64, 224, 208, 0.3), inset 0 0 20px rgba(249, 115, 22, 0.3);
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const INITIAL_LEDGER = [
            { id: 1, store: "⚙️ GearUP", category: "GAMING", desc: "Play Valorant with Lower Ping & No Lag!", url: "https://www.kqzyfj.com/click-101761790-17235983", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 6, store: "💇‍♀️ UNice", category: "BEAUTY", desc: "$10 Off Orders Over $129 Sitewide", url: "https://www.tkqlhce.com/click-101761790-15339213", img: "https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 17, store: "📹 Rexing RH2", category: "EXCLUSIVES", desc: "Exclusive Access: Rexing RH2 Series.", url: "https://www.tkqlhce.com/click-101761790-15795156", img: "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 25, store: "🏨 Hotels.com", category: "TRAVEL", desc: "Global lodging network reservations.", url: "https://www.dpbolvw.net/click-101761790-13828058", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 39, store: "✈️ Expedia", category: "TRAVEL", desc: "Global Flights & Premium Hotel Reservations", url: "http://www.anrdoezrs.net/click-101761790-10604120", img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 50, store: "🎮 GameFly", category: "GAMING", desc: "Rent & Buy Top Console Games", url: "https://www.kqzyfj.com/click-101761790-10436224", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80", isGame: false },
            { id: 30, store: "❄️ Whiteout Survival", category: "GAMING", desc: "100 Gems & Resources", url: "#", img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=300&q=80", code: "wm6xPkX4w", isGame: true },
            { id: 34, store: "🎮 Epic Games", category: "GAMING", desc: "Claim This Week's Free PC Games", url: "https://store.epicgames.com/en-US/free-games", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=300&q=80", code: "PUBLIC", isGame: true },
            { id: 37, store: "🛡️ RAID: Shadow Legends", category: "GAMING", desc: "Free Energy & Silver", url: "#", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=300&q=80", code: "RAIDTOGETHER", isGame: true }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [activeFilter, setActiveFilter] = useState("ALL");
            const [dynamicResult, setDynamicResult] = useState(null);

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                // Forces 6 second pure CSS animation
                await new Promise(resolve => setTimeout(resolve, 6000));

                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: searchInput, code: "TEST-CODE" })
                    });
                    const data = await response.json();
                    const fullText = data.response || "No data received.";
                    
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const extractedUrls = fullText.match(urlRegex);
                    const linkUrl = extractedUrls ? extractedUrls[0] : null;
                    const cleanDesc = linkUrl ? fullText.replace(linkUrl, '').trim() : fullText;
                    
                    setDynamicResult({ store: searchInput.toUpperCase(), desc: cleanDesc, url: linkUrl, img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80", code: "VERIFIED" });
                } catch (error) {
                    setDynamicResult({ store: "ERROR", desc: "Backend not reached.", url: null, img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=300&q=80", code: "ERROR" });
                }
                setAiState("idle");
            };

            const displayedLedger = dynamicResult ? [dynamicResult] : (activeFilter === "ALL" ? INITIAL_LEDGER : INITIAL_LEDGER.filter(item => item.category === activeFilter));

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC" && codeText !== "VERIFIED") {
                    navigator.clipboard.writeText(codeText);
                    alert(`Copied to clipboard: ${codeText}`);
                }
            };

            return (
                <>
                    {/* LEFT / TOP SIDEBAR */}
                    <div className="sidebar">
                        <div className="sidebar-logo"><span>>_</span>PromoPro</div>
                        <div className={`nav-item ${activeFilter === "ALL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("ALL"); setDynamicResult(null);}}>🏠 Dashboard</div>
                        <div className={`nav-item ${activeFilter === "GAMING" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("GAMING"); setDynamicResult(null);}}>🎮 Gaming</div>
                        <div className={`nav-item ${activeFilter === "EXCLUSIVES" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("EXCLUSIVES"); setDynamicResult(null);}}>🔒 Exclusives</div>
                        <div className={`nav-item ${activeFilter === "TRAVEL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("TRAVEL"); setDynamicResult(null);}}>✈️ Travel</div>
                    </div>

                    {/* MAIN DASHBOARD */}
                    <div className="main-content">
                        <div className="dashboard-window">
                            
                            {/* NEW CSS SPINNER OVERLAY (No Images) */}
                            {aiState === "searching" && (
                                <div className="searching-overlay">
                                    <div className="pure-css-spinner"></div>
                                    <h2 style={{color: '#40e0d0', letterSpacing: '2px', textShadow: '0 0 10px rgba(64, 224, 208, 0.5)'}}>AI SCAN IN PROGRESS</h2>
                                    <p style={{fontFamily: 'monospace', color: '#f97316'}}>BYPASSING ENCRYPTION & EXTRACTING NODES...</p>
                                </div>
                            )}

                            <div className="window-header">
                                <h1 className="window-title">System Database</h1>
                                <div className="search-box">
                                    <input 
                                        className="search-input" 
                                        placeholder="Verify Game or Store..." 
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                    />
                                    <button className="search-btn" onClick={handleVerify}>SCAN</button>
                                </div>
                            </div>

                            {/* COMPACT CARDS GRID */}
                            <div className="results-grid">
                                {displayedLedger.map((p, index) => (
                                    <div className="compact-card" key={p.id || index}>
                                        <img src={p.img} alt={p.store} className="card-image" />
                                        <h3 className="card-title">{p.store}</h3>
                                        <p className="card-desc">{p.desc}</p>
                                        
                                        {p.url && p.url !== "#" ? (
                                            <a href={p.url} target="_blank" rel="noopener noreferrer" className="claim-btn">Claim Deal</a>
                                        ) : p.code ? (
                                            <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>COPY: {p.code}</button>
                                        ) : (
                                            <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed', color: '#a1a1aa', borderColor: '#a1a1aa'}}>NO CODES</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
