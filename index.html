<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PromoPro Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            /* High-res Space/Sci-fi Background to match your mockup */
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* Keeps it feeling like a desktop app */
        }
        
        #root { 
            width: 100%; 
            height: 100vh; 
            display: flex; 
            background: rgba(2, 6, 23, 0.5); /* Darkens the background slightly so UI pops */
        }

        /* --- SIDEBAR LAYOUT (Left Menu) --- */
        .sidebar {
            width: 260px;
            background: rgba(10, 25, 47, 0.6);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(57, 255, 20, 0.3);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            height: 100vh;
        }

        .sidebar-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #39ff14;
            display: flex;
            align-items: center;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .sidebar-logo span { color: #ffffff; margin-right: 10px; }

        .nav-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #a1a1aa;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(57, 255, 20, 0.1);
            color: #39ff14;
            border-left: 4px solid #39ff14;
        }

        /* --- MAIN DASHBOARD AREA (Right Side) --- */
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        /* THE MASSIVE GLASS WINDOW */
        .dashboard-window {
            width: 100%;
            max-width: 1200px;
            background: rgba(6, 15, 28, 0.7);
            backdrop-filter: blur(25px);
            border: 2px solid rgba(57, 255, 20, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* HEADER / SEARCH AREA INSIDE WINDOW */
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(57, 255, 20, 0.2);
            padding-bottom: 20px;
        }
        .window-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin: 0;
        }

        .search-box {
            display: flex;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #39ff14;
            border-radius: 8px;
            overflow: hidden;
            width: 400px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; color: #39ff14; padding: 12px 20px; font-family: monospace; font-size: 16px; outline: none;
        }
        .search-btn {
            background: #39ff14; color: #020617; border: none; padding: 0 20px; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover { filter: brightness(1.2); }

        /* --- HORIZONTAL CARDS (Matching your picture) --- */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .horizontal-card {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(57, 255, 20, 0.4);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .horizontal-card:hover {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            border-color: #39ff14;
        }

        .card-top-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-details {
            flex: 1;
        }
        .card-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .card-desc {
            font-size: 14px;
            color: #a1a1aa;
            margin: 0;
        }

        .card-stats {
            color: #39ff14;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            text-align: right;
        }

        /* MASSIVE GREEN CLAIM BUTTON */
        .claim-btn {
            width: 100%;
            background: #39ff14;
            color: #020617;
            border: none;
            padding: 15px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .claim-btn:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .copy-btn {
            width: 100%;
            background: rgba(57, 255, 20, 0.1);
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 15px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .copy-btn:hover { background: #39ff14; color: #020617; }

        /* SEARCHING OVERLAY */
        .searching-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6, 15, 28, 0.9);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50;
        }
        @keyframes spin { 100% { transform: rotate(360deg); filter: drop-shadow(0 0 25px #39ff14) brightness(1.5); } }
        .spinning-logo { width: 120px; height: 120px; animation: spin 4s linear infinite; filter: drop-shadow(0 0 10px #39ff14); margin-bottom: 20px; }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Added gaming images so they are no longer blank!
        const INITIAL_LEDGER = [
            { id: 1, store: "⚙️ GearUP", category: "GAMING", desc: "Play Valorant with Lower Ping & No Lag!", url: "https://www.kqzyfj.com/click-101761790-17235983", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 6, store: "💇‍♀️ UNice", category: "BEAUTY", desc: "$10 Off Orders Over $129 Sitewide", url: "https://www.tkqlhce.com/click-101761790-15339213", img: "https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 17, store: "📹 Rexing RH2", category: "EXCLUSIVES", desc: "Exclusive Access: Rexing RH2 Series.", url: "https://www.tkqlhce.com/click-101761790-15795156", img: "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 25, store: "🏨 Hotels.com", category: "TRAVEL", desc: "Global lodging network reservations.", url: "https://www.dpbolvw.net/click-101761790-13828058", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 39, store: "✈️ Expedia", category: "TRAVEL", desc: "Global Flights & Premium Hotel Reservations", url: "http://www.anrdoezrs.net/click-101761790-10604120", img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 50, store: "🎮 GameFly", category: "GAMING", desc: "Rent & Buy Top Console Games", url: "https://www.kqzyfj.com/click-101761790-10436224", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=200&q=80", isGame: false },
            { id: 29, store: "🧟 State of Survival", category: "GAMING", desc: "No global codes available.", url: "#", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=200&q=80", isGame: true },
            { id: 30, store: "❄️ Whiteout Survival", category: "GAMING", desc: "100 Gems & Resources", url: "#", img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?auto=format&fit=crop&w=200&q=80", code: "wm6xPkX4w", isGame: true },
            { id: 34, store: "🎮 Epic Games", category: "GAMING", desc: "Claim This Week's Free PC Games", url: "https://store.epicgames.com/en-US/free-games", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=200&q=80", code: "PUBLIC", isGame: true },
            { id: 37, store: "🛡️ RAID: Shadow Legends", category: "GAMING", desc: "Free Energy & Silver", url: "#", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=200&q=80", code: "RAIDTOGETHER", isGame: true }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [activeFilter, setActiveFilter] = useState("ALL");
            const [dynamicResult, setDynamicResult] = useState(null);

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                // Forces 6 second animation delay
                await new Promise(resolve => setTimeout(resolve, 6000));

                try {
                    const response = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: searchInput, code: "TEST-CODE" })
                    });
                    const data = await response.json();
                    const fullText = data.response || "No data received.";
                    
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const extractedUrls = fullText.match(urlRegex);
                    const linkUrl = extractedUrls ? extractedUrls[0] : null;
                    const cleanDesc = linkUrl ? fullText.replace(linkUrl, '').trim() : fullText;
                    
                    setDynamicResult({ store: searchInput.toUpperCase(), desc: cleanDesc, url: linkUrl, img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=200&q=80", code: "VERIFIED" });
                } catch (error) {
                    setDynamicResult({ store: "ERROR", desc: "Backend not reached.", url: null, img: "", code: "ERROR" });
                }
                setAiState("idle");
            };

            const displayedLedger = dynamicResult ? [dynamicResult] : (activeFilter === "ALL" ? INITIAL_LEDGER : INITIAL_LEDGER.filter(item => item.category === activeFilter));

            const copyCode = (e, codeText) => {
                e.preventDefault(); 
                if (codeText && codeText !== "AUTO-ROUTED" && codeText !== "PUBLIC" && codeText !== "VERIFIED") {
                    navigator.clipboard.writeText(codeText);
                    alert(`Copied to clipboard: ${codeText}`);
                }
            };

            return (
                <>
                    {/* LEFT SIDEBAR */}
                    <div className="sidebar">
                        <div className="sidebar-logo"><span>P</span>PromoPro</div>
                        <div className={`nav-item ${activeFilter === "ALL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("ALL"); setDynamicResult(null);}}>🏠 Dashboard</div>
                        <div className={`nav-item ${activeFilter === "GAMING" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("GAMING"); setDynamicResult(null);}}>🎮 Gaming</div>
                        <div className={`nav-item ${activeFilter === "EXCLUSIVES" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("EXCLUSIVES"); setDynamicResult(null);}}>🔒 Exclusives</div>
                        <div className={`nav-item ${activeFilter === "TRAVEL" && !dynamicResult ? 'active' : ''}`} onClick={() => {setActiveFilter("TRAVEL"); setDynamicResult(null);}}>✈️ Travel</div>
                        <div className="nav-item" style={{marginTop: 'auto'}}>⚙️ Settings</div>
                    </div>

                    {/* MAIN DASHBOARD */}
                    <div className="main-content">
                        <div className="dashboard-window" style={{position: 'relative'}}>
                            
                            {/* OVERLAY FOR SEARCHING */}
                            {aiState === "searching" && (
                                <div className="searching-overlay">
                                    <img src="logo.png" className="spinning-logo" alt="Scanning..." />
                                    <h2 style={{color: '#39ff14', letterSpacing: '2px'}}>AI ENGINE ACTIVE</h2>
                                    <p style={{fontFamily: 'monospace', color: '#a1a1aa'}}>BYPASSING ENCRYPTION & EXTRACTING SECURE NODES...</p>
                                </div>
                            )}

                            <div className="window-header">
                                <h1 className="window-title">AI Promo Results</h1>
                                <div className="search-box">
                                    <input 
                                        className="search-input" 
                                        placeholder=">_ Verify Game or Store..." 
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                                    />
                                    <button className="search-btn" onClick={handleVerify}>SCAN</button>
                                </div>
                            </div>

                            <div className="results-list">
                                {displayedLedger.map((p, index) => (
                                    <div className="horizontal-card" key={p.id || index}>
                                        <div className="card-top-row">
                                            <img src={p.img} alt={p.store} className="card-image" />
                                            <div className="card-details">
                                                <h3 className="card-title">{p.store}</h3>
                                                <p className="card-desc">{p.desc}</p>
                                            </div>
                                            <div className="card-stats">
                                                Active Node<br/>
                                                <span style={{color: '#ffffff'}}>{p.category || "AI VERIFIED"}</span>
                                            </div>
                                        </div>
                                        
                                        {p.url && p.url !== "#" ? (
                                            <a href={p.url} target="_blank" rel="noopener noreferrer" className="claim-btn">Claim Deal</a>
                                        ) : p.code ? (
                                            <button className="copy-btn" onClick={(e) => copyCode(e, p.code)}>COPY CODE: {p.code}</button>
                                        ) : (
                                            <button className="copy-btn" style={{opacity: 0.5, cursor: 'not-allowed'}}>NO ACTIVE CODES</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
