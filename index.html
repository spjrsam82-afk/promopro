<!DOCTYPE html>
<html lang="en">
<head>
    <meta name='impact-site-verification' value='47d48f78-6a3f-4930-9a68-a6a28aa108e1'>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>PromoPro System Ledger</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex;
            min-height: 100vh;
        }

        .overlay-tint {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 11, 24, 0.7); 
            z-index: -1;
        }

        #root { 
            width: 100%;
            display: flex; 
            flex-direction: row; 
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            #root { flex-direction: column; }
            .sidebar { width: 100% !important; height: auto !important; position: relative !important; flex-direction: column !important; border-right: none !important; border-bottom: 2px solid rgba(139, 92, 246, 0.4) !important; padding: 20px !important; }
            .nav-menu { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding-top: 15px; margin-bottom: 15px;}
            .nav-item { padding: 8px 16px !important; margin: 0 !important; white-space: nowrap; font-size: 13px !important; flex-shrink: 0; }
            .career-context { display: none; }
            .main-content { padding: 20px 15px !important; }
            .search-wrapper { width: 100% !important; margin-bottom: 20px !important; }
            .grid { grid-template-columns: 1fr !important; }
        }

        .sidebar {
            width: 280px;
            background: rgba(11, 15, 30, 0.95);
            border-right: 1px solid rgba(139, 92, 246, 0.3);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .logo-icon {
            background: transparent;
            color: #f97316;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            width: 32px; height: 32px;
            display: flex; justify-content: center; align-items: center;
            margin-right: 12px; font-size: 20px;
            box-shadow: inset 0 0 10px rgba(139, 92, 246, 0.5);
        }

        .nav-matrix-title {
            color: #64748b;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .nav-item {
            padding: 14px 18px;
            margin-bottom: 5px;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-item.active {
            background: rgba(139, 92, 246, 0.3);
            border-left: 4px solid #8b5cf6;
            box-shadow: inset 10px 0 20px rgba(139, 92, 246, 0.2);
        }
        .nav-item:hover:not(.active) { background: rgba(139, 92, 246, 0.1); }

        .career-context {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .career-title { color: #94a3b8; font-size: 12px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .career-icons { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        .career-icons span { font-size: 24px; color: #f97316; }
        .cs50-icon {
            border: 2px solid #8b5cf6; color: #8b5cf6 !important; border-radius: 6px; padding: 2px 8px; font-family: monospace; font-size: 14px !important; font-weight: bold;
        }
        .career-box {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .search-wrapper {
            background: rgba(10, 15, 30, 0.8);
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            padding: 12px 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            margin: 0 auto 40px auto;
            display: flex;
        }
        .system-search {
            width: 100%; background: transparent; border: none; color: #8b5cf6; font-family: monospace; font-size: 15px; outline: none;
        }
        .system-search::placeholder { color: rgba(139, 92, 246, 0.6); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .matrix-card {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: 0.3s;
        }
        .matrix-card:hover { transform: translateY(-3px); }

        .theme-orange { border: 2px solid #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
        .theme-green { border: 2px solid #4ade80; box-shadow: 0 0 20px rgba(74, 222, 128, 0.3); }

        .card-header { font-size: 15px; font-weight: bold; color: #ffffff; }
        .card-header span { font-weight: normal; color: #cbd5e1; }

        .card-banner {
            width: 100%; height: 160px; object-fit: cover; border-radius: 8px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
        }
        .card-banner-contain {
            width: 100%; height: 160px; object-fit: contain; border-radius: 8px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .fallback-bg {
            width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; font-family: monospace; font-size: 14px; text-transform: uppercase;
        }

        .card-footer {
            display: flex; justify-content: space-between; align-items: flex-end; margin-top: 5px;
        }
        .card-info {
            font-family: monospace; font-size: 13px; color: #cbd5e1; line-height: 1.6;
        }
        .highlight { color: #4ade80; font-weight: bold; letter-spacing: 1px; }
        .hidden-code { color: #f97316; font-weight: bold; letter-spacing: 2px; }

        .status-btn {
            background: transparent; border: 1px solid #4ade80; color: #4ade80; padding: 8px 14px; border-radius: 4px; font-family: monospace; font-size: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        .status-btn:hover { background: #4ade80; color: #020617; box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);}

        /* --- THE NEW ANIMATION OVERLAY --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
            backdrop-filter: blur(15px);
        }
        
        .animation-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .css-spinner {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top: 4px solid #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
            z-index: 1;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .pulsing-logo { 
            width: 120px; 
            height: 120px; 
            object-fit: contain;
            z-index: 2;
            animation: pulseGlow 2.5s infinite ease-in-out; 
        }

        @keyframes pulseGlow { 
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #8b5cf6); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px #8b5cf6); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #8b5cf6); }
        }

        .close-btn { margin-top: 20px; background: transparent; color: #f97316; border: 1px solid #f97316; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // THE PROXY ENGINE: Forces broken images to load by stripping their security headers
        const PROXY_URL = "https://wsrv.nl/?url=";

        const SafeImage = ({ src, alt, className }) => {
            const [error, setError] = useState(false);
            if (error || !src) {
                return <div className="fallback-bg">{alt}</div>;
            }
            // Route the image through the proxy to bypass hotlinking protection
            const proxiedSrc = src.startsWith('http') ? PROXY_URL + encodeURIComponent(src) : src;
            return <img src={proxiedSrc} alt={alt} className={className} onError={() => setError(true)} />;
        };

        const INITIAL_LEDGER = [
            { id: 1, store: "Whiteout Survival", category: "Mobile Gaming Node", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/08/94/39/0894396b-5c8e-5992-0b89-a29d6c1df779/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "wm6xPkX4w", status: "ACTIVE", btn: "COPY & CLAIM", theme: "orange", url: "#", fit: "cover" },
            { id: 2, store: "Merge Dragons!", category: "Mobile Gaming Node", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/7e/6d/2c/7e6d2c14-5d51-6c58-8b9a-4f51e04cf5e2/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "green", url: "https://www.anrdoezrs.net/click-101761790-15043134", fit: "cover" },
            { id: 3, store: "GAMIVO", category: "Digital Key Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Gamivo_logo.png/800px-Gamivo_logo.png", code: "wm6xPkX4w", status: "ACTIVE", btn: "COPY & CLAIM", theme: "orange", url: "https://www.kqzyfj.com/click-101761790-17235983", fit: "contain" },
            { id: 4, store: "GearUP", category: "Technical Node", img: "https://www.gearupbooster.com/images/index/logo.png", code: "wm6xPkX4w", status: "ACTIVE", btn: "COPY & CLAIM", theme: "green", url: "https://www.anrdoezrs.net/click-101761790-17235980", fit: "contain" },
            { id: 5, store: "Call of Duty Mobile", category: "Gaming Node", img: "https://www.callofduty.com/content/dam/atvi/callofduty/cod-touchui/blog/hero/codm/CODM-S6-SYNTHWAVE-TOUT.jpg", code: "DCEPZBZKFD", status: "ACTIVE", btn: "COPY & CLAIM", theme: "orange", url: "#", fit: "cover" },
            { id: 6, store: "Epic Games", category: "Gaming Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Epic_Games_logo.svg/800px-Epic_Games_logo.svg.png", code: "PUBLIC", status: "ACTIVE", btn: "CLAIM DEAL", theme: "green", url: "https://store.epicgames.com/en-US/free-games", fit: "contain" },
            { id: 7, store: "State of Survival", category: "Mobile Gaming Node", img: "https://cdn2.unrealengine.com/egs-stateofsurvival-funplusinternationalag-g1a-00-1920x1080-4dfcc66504b2.jpg", code: "SOS2026", status: "ACTIVE", btn: "COPY & CLAIM", theme: "orange", url: "#", fit: "cover" },
            { id: 8, store: "Genshin Impact", category: "Gaming Node", img: "https://cdn2.unrealengine.com/genshin-impact-1920x1080-4963574c89d8.jpg", code: "NMI20MAJGIBP", status: "ACTIVE", btn: "COPY & CLAIM", theme: "green", url: "#", fit: "cover" },
            { id: 9, store: "RAID: Shadow Legends", category: "Gaming Node", img: "https://cdn2.unrealengine.com/egs-raidshadowlegends-plarium-g1a-03-1920x1080-6079c6d48259.jpg", code: "RAIDTOGETHER", status: "ACTIVE", btn: "COPY & CLAIM", theme: "orange", url: "#", fit: "cover" },
            { id: 10, store: "Roblox", category: "Gaming Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/800px-Roblox_player_icon_black.svg.png", code: "FREENGNBOI", status: "ACTIVE", btn: "COPY & CLAIM", theme: "green", url: "#", fit: "contain" },
            { id: 11, store: "GameFly", category: "Console Gaming Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/GameFly_logo.svg/800px-GameFly_logo.svg.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "orange", url: "https://www.kqzyfj.com/click-101761790-10436224", fit: "contain" },
            { id: 12, store: "Expedia", category: "Travel Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Expedia_logo.svg/800px-Expedia_logo.svg.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "green", url: "http://www.anrdoezrs.net/click-101761790-10604120", fit: "contain" },
            { id: 13, store: "UNice", category: "Beauty Node", img: "https://www.unice.com/static/version_1/images/logo.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "orange", url: "https://www.tkqlhce.com/click-101761790-15339213", fit: "contain" },
            { id: 14, store: "Vrbo", category: "Travel Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Vrbo_logo.svg/800px-Vrbo_logo.svg.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "green", url: "https://www.kqzyfj.com/click-101761790-13394715", fit: "contain" },
            { id: 15, store: "Rexing", category: "Exclusive Node", img: "https://www.rexingusa.com/wp-content/uploads/2019/08/Rexing-Logo-White.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "orange", url: "https://www.tkqlhce.com/click-101761790-15795156", fit: "contain" },
            { id: 16, store: "Hotels.com", category: "Travel Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Hotels.com_logo.svg/800px-Hotels.com_logo.svg.png", code: "AUTO-ROUTED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "green", url: "https://www.dpbolvw.net/click-101761790-13828058", fit: "contain" },
            { id: 17, store: "Idle Outpost", category: "Gaming Node", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/21/53/43/21534351-876a-542e-18e3-05c2a121e7d2/AppIcon-1x_U007emarketing-0-7-0-85-220.png/512x512bb.jpg", code: "WEBSHOP", status: "ACTIVE", btn: "CLAIM DEAL", theme: "orange", url: "#", fit: "contain" },
            { id: 18, store: "Golf Rival", category: "Gaming Node", img: "https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a4/09/b8/a409b85c-6b3a-5f34-318e-4f058e5a7b8e/AppIcon-0-0-1x_U007emarketing-0-0-0-5-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/512x512bb.jpg", code: "NONE", status: "STANDBY", btn: "PENDING", theme: "green", url: "#", fit: "contain" }
        ];

        function App() {
            const [searchInput, setSearchInput] = useState("");
            const [aiState, setAiState] = useState("idle"); 
            const [dynamicResult, setDynamicResult] = useState(null);
            
            // Tracks which codes have been revealed by clicking the button
            const [revealedCodes, setRevealedCodes] = useState({});

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                await new Promise(resolve => setTimeout(resolve, 6000));

                const searchLower = searchInput.toLowerCase();
                const matchedAffiliate = INITIAL_LEDGER.find(item => item.store.toLowerCase().includes(searchLower));

                if (matchedAffiliate) {
                    setDynamicResult(matchedAffiliate);
                } else {
                    setDynamicResult({ id: 999, store: searchInput.toUpperCase(), category: "Extracted Node", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Octicons-mark-github.svg/512px-Octicons-mark-github.svg.png", code: "VERIFIED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "orange", url: "#", fit: "contain" });
                }
                setAiState("result");
            };

            const handleAction = (e, id, codeText, url) => {
                e.preventDefault(); 
                
                // 1. Instantly reveal the code on the card
                setRevealedCodes(prev => ({ ...prev, [id]: true }));

                const hasLink = url && url !== "#";
                const hasCode = codeText && codeText !== "AUTO-ROUTED" && codeText !== "NONE" && codeText !== "WEBSHOP" && codeText !== "PUBLIC";

                // 2. Copy to clipboard
                if (hasCode) {
                    navigator.clipboard.writeText(codeText);
                    alert(`System Log: Code '${codeText}' revealed and copied to clipboard. Redirecting...`);
                }

                // 3. Drop cookie & open tracking link
                if (hasLink) {
                    window.open(url, "_blank");
                }
            };

            const renderCode = (id, code) => {
                if (code === "AUTO-ROUTED" || code === "NONE" || code === "PUBLIC" || code === "WEBSHOP") {
                    return <span className="highlight">'{code}'</span>;
                }
                return revealedCodes[id] ? <span className="highlight">'{code}'</span> : <span className="hidden-code">'••••••••'</span>;
            };

            return (
                <>
                    <div className="overlay-tint"></div>

                    <div className="sidebar">
                        <div className="sidebar-logo">
                            <div className="logo-icon">P</div>
                            <span>Promo</span><span style={{color: '#f97316'}}>Pro</span>
                        </div>
                        
                        <div className="nav-matrix-title">NAV-MATRIX</div>
                        <div className="nav-menu">
                            <div className="nav-item">🏠 HOME</div>
                            <div className="nav-item active">📄 SYSTEM LEDGER</div>
                            <div className="nav-item">🎮 GAMING NODES</div>
                            <div className="nav-item">🏷️ EXCLUSIVE DEALS</div>
                            <div className="nav-item">🌐 TRAVEL PORTAL</div>
                        </div>

                        <div className="career-context">
                            <div className="career-title">CAREER CONTEXT</div>
                            <div className="career-icons">
                                <span>👷</span> <span>🚜</span> <span className="cs50-icon">CS50</span>
                            </div>
                            <div className="career-box">
                                <strong>CAREER FOCUS:</strong><br/>
                                Samuel P. Jr. (Foreman & Operator. 23+ Yrs experience in grading & utilities.)
                            </div>
                        </div>
                    </div>

                    <div className="main-content">
                        
                        <div className="search-wrapper">
                            <input 
                                className="system-search" 
                                placeholder="SYSTEM DATABASE SEARCH // Execute" 
                                value={searchInput}
                                onChange={(e) => setSearchInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                            />
                        </div>

                        {aiState === "idle" && (
                            <div className="grid">
                                {INITIAL_LEDGER.map((p) => (
                                    <div className={`matrix-card theme-${p.theme}`} key={p.id}>
                                        <div className="card-header">{p.store} <span>// {p.category}</span></div>
                                        <SafeImage src={p.img} alt={p.store} className={p.fit === "contain" ? "card-banner-contain" : "card-banner"} />
                                        <div className="card-footer">
                                            <div className="card-info">
                                                <div>code: {renderCode(p.id, p.code)}</div>
                                                <div>status: <span className="highlight">'{p.status}'</span></div>
                                            </div>
                                            <button className="status-btn" onClick={(e) => handleAction(e, p.id, p.code, p.url)}>{p.btn}</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* --- ANIMATION WITH HARDCODED RAW GITHUB URL TO PREVENT BREAKING --- */}
                        {aiState === "searching" && (
                            <div className="modal-overlay">
                                <div className="animation-container">
                                    <div className="css-spinner"></div>
                                    <SafeImage src="https://raw.githubusercontent.com/spjrsam82-afk/promopro/main/1781102482198.png" className="pulsing-logo" alt="" />
                                </div>
                            </div>
                        )}

                        {/* --- SEARCH RESULT --- */}
                        {aiState === "result" && dynamicResult && (
                            <div className="modal-overlay">
                                <div className={`matrix-card theme-${dynamicResult.theme}`} style={{width: '90%', maxWidth: '500px'}}>
                                    <div className="card-header">{dynamicResult.store} <span>// {dynamicResult.category}</span></div>
                                    <SafeImage src={dynamicResult.img} alt={dynamicResult.store} className={dynamicResult.fit === "contain" ? "card-banner-contain" : "card-banner"} />
                                    <div className="card-footer">
                                        <div className="card-info">
                                            <div>code: {renderCode(dynamicResult.id, dynamicResult.code)}</div>
                                            <div>status: <span className="highlight">'{dynamicResult.status}'</span></div>
                                        </div>
                                        <button className="status-btn" onClick={(e) => handleAction(e, dynamicResult.id, dynamicResult.code, dynamicResult.url)}>{dynamicResult.btn}</button>
                                    </div>
                                </div>
                                <button className="close-btn" onClick={() => setAiState("idle")}>X CLOSE ENGINE</button>
                            </div>
                        )}
                    </div>
                </>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
