        const SafeImage = ({ src, alt, className }) => {
            const [attempts, setAttempts] = useState(0);
            if (!src || attempts >= 2) {
                return <div className="fallback-bg">🎮 {alt}</div>;
            }
            const proxiedSrc = attempts === 1 ? PROXY_URL + encodeURIComponent(src) : src;
            return (
                <img
                    src={proxiedSrc}
                    alt={alt}
                    className={className}
                    onError={() => setAttempts(a => a + 1)}
                />
            );

        function App() {
            const [searchInput, setSearchInput]     = useState("");
            const [aiState, setAiState]             = useState("idle");
            const [dynamicResult, setDynamicResult] = useState(null);
            const [revealedCodes, setRevealedCodes] = useState({});

            const handleVerify = async () => {
                if (!searchInput.trim()) return;
                setAiState("searching");
                setDynamicResult(null);

                await new Promise(resolve => setTimeout(resolve, 6000));

                const searchLower = searchInput.toLowerCase();
                const match = ALL_ENTRIES.find(item => item.store.toLowerCase().includes(searchLower));

                if (match) {
                    setDynamicResult(match);
                } else {
                    setDynamicResult({
                        id: 999, store: searchInput.toUpperCase(), category: "Extracted Node",
                        img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Octicons-mark-github.svg/512px-Octicons-mark-github.svg.png",
                        code: "VERIFIED", status: "ACTIVE", btn: "AUTO-ROUTED", theme: "orange", url: "#", fit: "contain"
                    });

                setAiState("result");
            };

            const handleAction = (e, id, codeText, url) => {
                e.preventDefault();
                setRevealedCodes(prev => ({ ...prev, [id]: true }));

                const hasLink = url && url !== "#";
                const hasCode = codeText && !["AUTO-ROUTED","NONE","WEBSHOP","PUBLIC"].includes(codeText);

                if (hasCode) {
                    navigator.clipboard.writeText(codeText);
                    alert(`System Log: Code '${codeText}' revealed and copied to clipboard. Redirecting...`);
                }
                if (hasLink) {
                    window.open(url, "_blank");
                }
            };

                if (["AUTO-ROUTED","NONE","PUBLIC","WEBSHOP"].includes(code)) {

                        alt={p.store}
                        className={p.fit === "contain" ? "card-banner-contain" : "card-banner"}

                        </div>

                            onClick={(e) => handleAction(e, p.id, p.code, p.url)}

                    <div className="overlay-tint"></div>

                    <div className="sidebar">
                        <div className="sidebar-logo">
                            <div className="logo-icon">P</div>
                            <span>Promo</span><span style={{color: '#f97316'}}>Pro</span>
                        </div>
                        
                        <div className="nav-matrix-title">NAV-MATRIX</div>
                        <div className="nav-menu">
                            <div className="nav-item">🏠 HOME</div>
                            <div className="nav-item active">📄 SYSTEM LEDGER</div>
                            <div className="nav-item">🎮 GAMING NODES</div>
                            <div className="nav-item">🏷️ EXCLUSIVE DEALS</div>
                            <div className="nav-item">🌐 TRAVEL PORTAL</div>
                        </div>

                        <div className="career-context">
                            <div className="career-title">SYSTEM STATUS</div>
                            <div className="career-icons">
                                <span>🛡️</span> <span>⚡</span> <span className="cs50-icon">SECURE</span>
                            </div>
                            <div className="career-box">
                                <strong>SYSTEM ADMIN:</strong><br/>
                                Access Level: Tier 1<br/>
                                Engine Status: Online &amp; Routing
                            </div>
                        </div>
                    </div>

                    <div className="main-content">

                        <div className="search-wrapper">
                            <input
                                className="system-search"
                                placeholder="SYSTEM DATABASE SEARCH // Execute"
                                value={searchInput}
                                onChange={(e) => setSearchInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleVerify()}
                            />
                        </div>

                        {aiState === "idle" && (
                            <>
                                {/* ── CORE AFFILIATE LEDGER ── */}
                                <div className="section-label">⚡ Core Affiliate Ledger</div>
                                <div className="grid">
                                    {CORE_LEDGER.map(renderCard)}
                                </div>

                                {/* ── GAMIVO GAMING HUB ── */}
                                <div className="section-label">🎮 GAMIVO Gaming Hub</div>
                                <div className="grid">
                                    {GAMIVO_NODES.map(renderCard)}
                                </div>
                            </>
                        )}

                        {/* SEARCH ANIMATION */}
                        {aiState === "searching" && (
                            <div className="modal-overlay">
                                <div className="animation-container">
                                    <div className="css-spinner"></div>
                                    <SafeImage
                                        src="https://raw.githubusercontent.com/spjrsam82-afk/promopro/main/1781102482198.png"
                                        className="pulsing-logo"
                                        alt=""
                                    />
                                </div>
                            </div>
                        )}

                        {/* SEARCH RESULT */}
                        {aiState === "result" && dynamicResult && (
                            <div className="modal-overlay">
                                <div className={`matrix-card theme-${dynamicResult.theme}`} style={{width: '90%', maxWidth: '500px'}}>
                                    <div className="card-header">{dynamicResult.store} <span>// {dynamicResult.category}</span></div>
                                    <SafeImage
                                        src={dynamicResult.img}
                                        alt={dynamicResult.store}
                                        className={dynamicResult.fit === "contain" ? "card-banner-contain" : "card-banner"}
                                    />
                                    <div className="card-footer">
                                        <div className="card-info">
                                            <div>code: {renderCode(dynamicResult.id, dynamicResult.code)}</div>
                                            <div>status: <span className="highlight">'{dynamicResult.status}'</span></div>
                                        </div>
                                        <button
                                            className={`status-btn${dynamicResult.theme === "blue" ? " blue-btn" : ""}`}
                                            onClick={(e) => handleAction(e, dynamicResult.id, dynamicResult.code, dynamicResult.url)}
                                        >
                                            {dynamicResult.btn}
                                        </button>
                                    </div>
                                </div>
                                <button className="close-btn" onClick={() => setAiState("idle")}>✕ CLOSE ENGINE</button>
                            </div>
                        )}

                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
