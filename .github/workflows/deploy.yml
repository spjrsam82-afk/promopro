name: Deploy PromoPro to Cloudflare Pages

on:
  push:
    branches:
      - main # This triggers the deployment every time you update your main code

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: YOUR_CLOUDFLARE_ACCOUNT_ID # You need to replace this!
          projectName: promopro
          directory: . # This tells it to upload your index.html file
